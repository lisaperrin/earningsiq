[project]
name = "earningsiq"
version = "0.1.0"
description = "RAG question answering over SEC 10-K/10-Q filings with small local LLMs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    # Data ingestion
    "sec-edgar-downloader>=5.0.2",
    "pyrate-limiter<4",  # sec-edgar-downloader 5.0.2 breaks with the 4.x API
    "yfinance>=1.0",
    # Data processing
    "pandas>=2.2.0",
    "pyarrow>=15.0.0",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.1.0",
    # Vector store & embeddings
    "chromadb>=0.4.22",
    "sentence-transformers>=2.3.1",
    # LLM & fine-tuning
    "transformers>=4.45,<5",
    "torch>=2.2.0",
    "peft>=0.8.2",
    "accelerate>=0.26.1",
    "datasets>=2.16.1",
    # Evaluation
    "scipy>=1.12.0",
    "numpy>=1.26.3",
    "rouge-score>=0.1.2",
    # Utilities
    "python-dotenv>=1.0.1",
    "pydantic>=2.6.1",
    "pydantic-settings>=2.1.0",
    "loguru>=0.7.2",
    "psutil>=5.9.0",
]

[dependency-groups]
dev = ["pytest>=7.4.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/earningsiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# PyPI's Windows wheels for torch are CPU-only, so on Windows torch comes from
# the PyTorch index with CUDA support. Linux wheels on PyPI already include it.
[tool.uv.sources]
torch = [{ index = "pytorch-cuda", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
